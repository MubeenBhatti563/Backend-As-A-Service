name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baas_db?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SESSION_SECRET: ci_session_secret_at_least_32_characters_long_for_security

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build shared packages
        run: pnpm --filter @baas/types build && pnpm --filter @baas/crypto-utils build

      - name: Deploy Prisma Migrations
        run: pnpm --dir app/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baas_db?schema=public

      - name: Test API
        run: pnpm test

      - name: Run E2E Tests
        run: pnpm --filter api run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baas_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SESSION_SECRET: ci_session_secret_at_least_32_characters_long_for_security

      - name: Build applications
        run: pnpm build
