# -----------------------------------------------
# 1. NETWORKS DEFINITION
# -----------------------------------------------
networks:
  baas-network:

# -----------------------------------------------
# 2. VOLUME DEFINITION
# -----------------------------------------------
volumes:
  baas-data:
  redis-data:

services:
  # -----------------------------------------------
  # 3. PostgreSQL Database
  # -----------------------------------------------
  db:
    image: postgres:18.6-alpine
    container_name: baas-database
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-baas_db}

    ports:
      - "5434:5432"
    volumes:
      - baas-data:/var/lib/postgresql
    networks:
      - baas-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-baas_db}",
        ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s

  # -----------------------------------------------
  # 4. Redis Cache
  # -----------------------------------------------
  cache:
    image: redis:7-alpine
    container_name: baas-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    networks:
      - baas-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------
  # 5. Nestjs API
  # -----------------------------------------------
  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    container_name: baas-api
    restart: unless-stopped
    ports:
      - 3000:3000

    env_file:
      - ./app/api/.env

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-baas_db}?schema=public

      # Redis connection internal DNS host
      REDIS_HOST: cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000}

    networks:
      - baas-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/api/v1/'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  # -----------------------------------------------
  # 6. Nextjs Web
  # -----------------------------------------------
  web:
    build:
      context: .
      dockerfile: app/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
    container_name: baas-web
    restart: unless-stopped
    ports:
      - 4000:4000
    env_file:
      - ./app/web/.env

    networks:
      - baas-network
    depends_on:
      api:
        condition: service_healthy
